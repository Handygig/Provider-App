name: provider_app
description: "Service Provider Mobile Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: ^8.1.5
  dartz: ^0.10.1
  cupertino_icons: ^1.0.8
  country_flags: ^4.1.2
  connectivity_plus: ^7.1.1
  google_fonts: ^8.1.0
  flutter_screenutil: ^5.9.3
  flutter_localizations:
    sdk: flutter
  equatable: ^2.1.0
  flutter_svg: ^2.3.0
  dio: ^5.11.0
  intl: ^0.20.2
  firebase_core: ^4.13.0
  google_maps_flutter: ^2.10.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon.jpeg"
  min_sdk_android: 21
